<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GBC Arcade</title>
  <meta name="description" content="Juega online a juegos de Game Boy Color." />
  <style>
    :root {
      --bg: #0d0f14;
      --panel: #161a22;
      --accent: #e10600;
      --text: #e8e6e3;
      --muted: #8a8f98;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    a { color: inherit; }
    header {
      width: 100%;
      padding: 1.1rem 1.5rem;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.75rem;
      border-bottom: 1px solid #232833;
      position: relative;
    }
    header h1 {
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    header h1 a { text-decoration: none; }
    header h1 .dot { color: var(--accent); }
    header .sub {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    #share-btn {
      display: none;
      position: absolute;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid #232833;
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    #share-btn:hover { border-color: var(--accent); }
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    #game-shell {
      width: 100%;
      background: var(--panel);
      border: 1px solid #232833;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: none;
    }
    #screen-wrap {
      width: 100%;
      aspect-ratio: 10 / 9; /* pantalla GBC 160x144 */
      max-height: 70vh;
      display: flex;
      justify-content: center;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    canvas#screen {
      height: 100%;
      aspect-ratio: 10 / 9;
      image-rendering: pixelated;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    /* Pad táctil (emulator.js lo muestra solo en pantallas táctiles) */
    #controller {
      display: none;
      width: 100%;
      padding: 1.1rem 0.5rem 0.4rem;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #controller-main { display: flex; justify-content: space-between; align-items: center; }
    #controller_dpad {
      position: relative;
      width: 156px;
      height: 156px;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #controller_dpad div {
      position: absolute;
      width: 52px;
      height: 52px;
      background: #1d222d;
      border: 1px solid #2c3342;
      border-radius: 8px;
    }
    #controller_up    { top: 0;    left: 52px; }
    #controller_down  { bottom: 0; left: 52px; }
    #controller_left  { top: 52px; left: 0; }
    #controller_right { top: 52px; right: 0; }
    #controller-ab { display: flex; gap: 1rem; align-items: center; }
    .roundBtn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #1d222d;
      border: 1px solid #2c3342;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #controller_a { margin-bottom: 1.6rem; }
    #controller-meta { display: flex; justify-content: center; gap: 1.2rem; margin-top: 0.9rem; }
    .capsuleBtn {
      border-radius: 999px;
      background: #1d222d;
      border: 1px solid #2c3342;
      color: var(--muted);
      padding: 0.5rem 1.4rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btnPressed { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
    /* Menú de ROMs */
    #menu { width: 100%; max-width: 480px; display: none; }
    #menu h2 {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      text-align: center;
    }
    #menu ul { list-style: none; }
    #menu li + li { margin-top: 0.6rem; }
    #menu a.cart {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--panel);
      border: 1px solid #232833;
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
      transition: border-color 0.15s, transform 0.15s;
    }
    #menu a.cart:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }
    #menu a.cart::before { content: "▸"; color: var(--accent); }
    #message {
      display: none;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    #message a { color: var(--text); }
    footer {
      width: 100%;
      padding: 0.9rem 1.5rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      border-top: 1px solid #232833;
    }
    footer kbd {
      background: #232833;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
      color: var(--text);
    }
    footer a { color: var(--muted); }
    @media (max-width: 600px) {
      main { padding: 0.5rem; }
      header { flex-wrap: wrap; padding: 0.8rem 1rem; }
      #share-btn { position: static; transform: none; }
      #game-shell { padding: 4px; border-radius: 6px; }
      footer .keys { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="/"><span class="dot">&#9673;</span> GBC Arcade</a></h1>
    <span class="sub" id="subtitle">Game Boy Color &middot; online</span>
    <button id="share-btn" type="button" title="Compartir este juego">&#8599; Compartir</button>
  </header>
  <main>
    <div id="menu">
      <h2>Elige un cartucho</h2>
      <ul id="rom-list"></ul>
    </div>
    <div id="game-shell">
      <div id="screen-wrap">
        <canvas id="screen" width="160" height="144"></canvas>
        <div id="loading">Cargando&hellip;</div>
      </div>
      <!-- Pad táctil que espera emulator.js (ids de GB Studio / binjgb) -->
      <div id="controller">
        <div id="controller-main">
          <div id="controller_dpad">
            <div id="controller_up"></div>
            <div id="controller_left"></div>
            <div id="controller_right"></div>
            <div id="controller_down"></div>
          </div>
          <div id="controller-ab">
            <div id="controller_b" class="roundBtn">B</div>
            <div id="controller_a" class="roundBtn">A</div>
          </div>
        </div>
        <div id="controller-meta">
          <div id="controller_select" class="capsuleBtn">Select</div>
          <div id="controller_start" class="capsuleBtn">Start</div>
        </div>
      </div>
    </div>
    <p id="message"></p>
  </main>
  <footer>
    <span class="keys" id="keys-help" style="display:none">Teclado: <kbd>&#8592;&#8593;&#8595;&#8594;</kbd> cruceta &middot; <kbd>Z</kbd> A &middot; <kbd>X</kbd> B &middot; <kbd>Enter</kbd> Start &middot; <kbd>Tab</kbd> Select &middot; <kbd>Shift</kbd> turbo &middot; </span>
    emulación por <a href="https://github.com/binji/binjgb">binjgb</a>
  </footer>

  <script>
    // Analytics (Umami Cloud). Sin ID, el tracking queda desactivado.
    const UMAMI_WEBSITE_ID = "1c485ac0-638f-492a-b935-d9fb8271e20a";
    if (UMAMI_WEBSITE_ID) {
      const u = document.createElement("script");
      u.defer = true;
      u.src = "https://cloud.umami.is/script.js";
      u.dataset.websiteId = UMAMI_WEBSITE_ID;
      document.head.appendChild(u);
    }
    function track(event, data) {
      if (window.umami) umami.track(event, data);
    }

    // Diagnóstico: con ?debug=1 se muestra un log en pantalla; los errores
    // JS se envían siempre a Umami (evento js-error) para poder investigarlos
    const DEBUG = new URLSearchParams(location.search).has("debug");
    function dbg(msg) {
      if (!DEBUG) return;
      let el = document.getElementById("dbg");
      if (!el) {
        el = document.createElement("pre");
        el.id = "dbg";
        el.style.cssText = "position:fixed;bottom:0;left:0;right:0;max-height:35vh;overflow:auto;" +
          "background:rgba(0,0,0,.85);color:#0f0;font-size:11px;padding:6px;z-index:9999;margin:0;" +
          "white-space:pre-wrap;pointer-events:none";
        document.body.appendChild(el);
      }
      el.textContent += "[" + new Date().toISOString().slice(11, 19) + "] " + msg + "\n";
    }
    window.addEventListener("error", (e) => {
      dbg("ERROR: " + e.message + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
      track("js-error", { msg: String(e.message).slice(0, 120), ua: navigator.userAgent.slice(0, 60) });
    });
    window.addEventListener("unhandledrejection", (e) => {
      dbg("PROMESA RECHAZADA: " + e.reason);
      track("js-error", { msg: ("rejection: " + e.reason).slice(0, 120), ua: navigator.userAgent.slice(0, 60) });
    });

    const romName = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
    const valid = /^[a-zA-Z0-9._-]+$/.test(romName);

    function show(id) { document.getElementById(id).style.display = "block"; }

    function prettyName(name) {
      return name.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    async function showMenu() {
      show("menu");
      const list = document.getElementById("rom-list");
      try {
        const roms = await (await fetch("/roms/index.json")).json();
        if (!roms.length) throw new Error("empty");
        for (const rom of roms) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "cart";
          a.href = "/" + encodeURIComponent(rom);
          a.textContent = prettyName(rom);
          li.appendChild(a);
          list.appendChild(li);
        }
      } catch {
        document.getElementById("menu").style.display = "none";
        const msg = document.getElementById("message");
        msg.textContent = "No hay ROMs disponibles todavía.";
        show("message");
      }
    }

    function fail(name, detail) {
      dbg("FALLO: " + detail);
      document.getElementById("game-shell").style.display = "none";
      const msg = document.getElementById("message");
      msg.innerHTML = "No se pudo cargar <strong>" + name.replace(/[&<>]/g, "") +
        "</strong>.<br><a href=\"/\">&#8592; Volver al men&uacute;</a>";
      show("message");
    }

    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = res;
        s.onerror = () => rej(new Error("no se pudo cargar " + src));
        document.body.appendChild(s);
      });
    }

    async function startGame(name) {
      document.title = prettyName(name) + " — GBC Arcade";
      document.getElementById("subtitle").textContent = prettyName(name);
      document.getElementById("keys-help").style.display = "inline";
      show("game-shell");

      // Botón de compartir
      const shareBtn = document.getElementById("share-btn");
      shareBtn.style.display = "block";
      shareBtn.addEventListener("click", async () => {
        track("share", { game: name });
        const shareData = {
          title: prettyName(name) + " — GBC Arcade",
          text: "Juega a " + prettyName(name) + " en tu navegador:",
          url: location.href,
        };
        if (navigator.share) {
          try { await navigator.share(shareData); } catch { /* cancelado */ }
        } else {
          await navigator.clipboard.writeText(location.href);
          const original = shareBtn.innerHTML;
          shareBtn.textContent = "¡Enlace copiado!";
          setTimeout(() => { shareBtn.innerHTML = original; }, 2000);
        }
      });

      // Descarga de la ROM controlada por nosotros (fetch estándar)
      const romUrl = "/roms/" + encodeURIComponent(name) + ".gbc";
      let romBuffer;
      dbg("descargando ROM: " + romUrl);
      try {
        const resp = await fetch(romUrl);
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        romBuffer = await resp.arrayBuffer();
        dbg("ROM descargada: " + romBuffer.byteLength + " bytes");
      } catch (err) {
        fail(name, "descarga ROM: " + err);
        return;
      }

      // Emulador: binjgb (vendorizado, el mismo que usa GB Studio)
      try {
        window.BINJGB_GAME_KEY = "gbc-" + name;
        dbg("cargando binjgb…");
        await loadScript("/vendor/binjgb/binjgb.js");
        await loadScript("/vendor/binjgb/emulator.js");
        dbg("binjgb cargado, arrancando");
        const { resumed } = await window.startBinjgb(romBuffer);
        if (resumed) {
          document.getElementById("subtitle").textContent = prettyName(name) + " · partida reanudada";
          dbg("partida reanudada");
        }
        dbg("jugando");
        document.getElementById("loading").style.display = "none";
        track("game-start", { game: name });
      } catch (err) {
        fail(name, "arranque emulador: " + err);
        track("js-error", { msg: ("binjgb: " + err).slice(0, 120), ua: navigator.userAgent.slice(0, 60) });
        return;
      }

      // Tiempo de juego: un "latido" por minuto con la pestaña visible
      setInterval(() => {
        if (!document.hidden) track("minute-played", { game: name });
      }, 60000);
    }

    if (!romName) showMenu();
    else if (valid) startGame(romName);
    else location.href = "/";
  </script>
</body>
</html>
