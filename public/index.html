<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GBC Arcade</title>
  <meta name="description" content="Juega online a juegos de Game Boy Color." />
  <style>
    :root {
      --bg: #0d0f14;
      --panel: #161a22;
      --accent: #e10600;
      --text: #e8e6e3;
      --muted: #8a8f98;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    a { color: inherit; }
    header {
      width: 100%;
      padding: 1.1rem 1.5rem;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.75rem;
      border-bottom: 1px solid #232833;
    }
    header h1 {
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    header h1 a { text-decoration: none; }
    header h1 .dot { color: var(--accent); }
    header .sub {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    header { position: relative; }
    #share-btn {
      display: none;
      position: absolute;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid #232833;
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    #share-btn:hover { border-color: var(--accent); }
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    #game-shell {
      width: 100%;
      background: var(--panel);
      border: 1px solid #232833;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: none;
    }
    #game {
      width: 100%;
      aspect-ratio: 10 / 9; /* pantalla GBC 160x144 */
      max-height: 78vh;
    }
    /* Menú de ROMs */
    #menu { width: 100%; max-width: 480px; display: none; }
    #menu h2 {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      text-align: center;
    }
    #menu ul { list-style: none; }
    #menu li + li { margin-top: 0.6rem; }
    #menu a.cart {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--panel);
      border: 1px solid #232833;
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
      transition: border-color 0.15s, transform 0.15s;
    }
    #menu a.cart:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }
    #menu a.cart::before { content: "▸"; color: var(--accent); }
    #message {
      display: none;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    #message a { color: var(--text); }
    footer {
      width: 100%;
      padding: 0.9rem 1.5rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      border-top: 1px solid #232833;
    }
    footer kbd {
      background: #232833;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
      color: var(--text);
    }
    footer a { color: var(--muted); }
    @media (max-width: 600px) {
      main { padding: 0.5rem; }
      header { flex-wrap: wrap; padding: 0.8rem 1rem; }
      #share-btn { position: static; transform: none; }
      #game-shell { padding: 4px; border-radius: 6px; }
      footer .keys { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="/"><span class="dot">&#9673;</span> GBC Arcade</a></h1>
    <span class="sub" id="subtitle">Game Boy Color &middot; online</span>
    <button id="share-btn" type="button" title="Compartir este juego">&#8599; Compartir</button>
  </header>
  <main>
    <div id="menu">
      <h2>Elige un cartucho</h2>
      <ul id="rom-list"></ul>
    </div>
    <div id="game-shell"><div id="game"></div></div>
    <p id="message"></p>
  </main>
  <footer>
    <span class="keys" id="keys-help" style="display:none">Teclado: <kbd>&#8592;&#8593;&#8595;&#8594;</kbd> cruceta &middot; <kbd>Z</kbd> A &middot; <kbd>X</kbd> B &middot; <kbd>Enter</kbd> Start &middot; <kbd>Shift</kbd> Select &middot; </span>
    emulación por <a href="https://emulatorjs.org">EmulatorJS</a>
  </footer>

  <script>
    // Analytics (Umami Cloud). Sin ID, el tracking queda desactivado.
    const UMAMI_WEBSITE_ID = "1c485ac0-638f-492a-b935-d9fb8271e20a";
    if (UMAMI_WEBSITE_ID) {
      const u = document.createElement("script");
      u.defer = true;
      u.src = "https://cloud.umami.is/script.js";
      u.dataset.websiteId = UMAMI_WEBSITE_ID;
      document.head.appendChild(u);
    }
    function track(event, data) {
      if (window.umami) umami.track(event, data);
    }

    const romName = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
    const valid = /^[a-zA-Z0-9._-]+$/.test(romName);

    function show(id) { document.getElementById(id).style.display = "block"; }

    function prettyName(name) {
      return name.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    async function showMenu() {
      show("menu");
      const list = document.getElementById("rom-list");
      try {
        const roms = await (await fetch("/roms/index.json")).json();
        if (!roms.length) throw new Error("empty");
        for (const rom of roms) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "cart";
          a.href = "/" + encodeURIComponent(rom);
          a.textContent = prettyName(rom);
          li.appendChild(a);
          list.appendChild(li);
        }
      } catch {
        document.getElementById("menu").style.display = "none";
        const msg = document.getElementById("message");
        msg.textContent = "No hay ROMs disponibles todavía.";
        show("message");
      }
    }

    async function startGame(name) {
      const romUrl = "/roms/" + encodeURIComponent(name) + ".gbc";
      const head = await fetch(romUrl, { method: "HEAD" });
      if (!head.ok) {
        const msg = document.getElementById("message");
        msg.innerHTML = "No existe ninguna ROM llamada <strong>" + name.replace(/[&<>]/g, "") +
          "</strong>.<br><a href=\"/\">&#8592; Volver al men&uacute;</a>";
        show("message");
        return;
      }
      document.title = prettyName(name) + " — GBC Arcade";
      document.getElementById("subtitle").textContent = prettyName(name);
      document.getElementById("keys-help").style.display = "inline";
      show("game-shell");

      const shareBtn = document.getElementById("share-btn");
      shareBtn.style.display = "block";
      shareBtn.addEventListener("click", async () => {
        track("share", { game: name });
        const shareData = {
          title: prettyName(name) + " — GBC Arcade",
          text: "Juega a " + prettyName(name) + " en tu navegador:",
          url: location.href,
        };
        if (navigator.share) {
          try { await navigator.share(shareData); } catch { /* cancelado */ }
        } else {
          await navigator.clipboard.writeText(location.href);
          const original = shareBtn.innerHTML;
          shareBtn.textContent = "¡Enlace copiado!";
          setTimeout(() => { shareBtn.innerHTML = original; }, 2000);
        }
      });

      window.EJS_player = "#game";
      window.EJS_core = "gambatte"; // core Game Boy / Game Boy Color
      window.EJS_gameUrl = romUrl;
      window.EJS_gameName = prettyName(name);
      window.EJS_language = "es-ES";
      window.EJS_color = "#e10600";
      // iOS bloquea el arranque sin gesto del usuario: la pantalla se queda
      // en negro si autoarrancamos. Ahí mostramos el botón Play de EmulatorJS.
      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      window.EJS_startOnLoaded = !isIOS;
      window.EJS_backgroundColor = "#161a22";
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      // Partidas y tiempo de juego: un evento al arrancar y un "latido"
      // por cada minuto jugado con la pestaña visible (minutos = nº de eventos)
      window.EJS_onGameStart = () => {
        track("game-start", { game: name });
        if (!window._playTimer) {
          window._playTimer = setInterval(() => {
            if (!document.hidden) track("minute-played", { game: name });
          }, 60000);
        }
      };
      const s = document.createElement("script");
      s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(s);
    }

    if (!romName) showMenu();
    else if (valid) startGame(romName);
    else location.href = "/";
  </script>
</body>
</html>
